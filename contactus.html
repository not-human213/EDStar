<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>EdStar | Contact Us</title>
	<style>
		:root {
			--bg: #0b1120;
			--text: #edf2ff;
			--muted: #a7b3d1;
			--accent: #22c55e;
			--border: rgba(148, 163, 184, 0.18);
			--shadow: 0 24px 80px rgba(0, 0, 0, 0.35);
		}
		* { box-sizing: border-box; }
		html { scroll-behavior: smooth; }
		body {
			margin: 0; font-family: Arial, Helvetica, sans-serif; color: var(--text); min-height: 100vh;
			background:
				radial-gradient(circle at top left, rgba(96, 165, 250, 0.18), transparent 28%),
				radial-gradient(circle at 85% 15%, rgba(34, 197, 94, 0.18), transparent 24%),
				linear-gradient(180deg, #08101f 0%, #0b1120 48%, #070b14 100%);
		}
		a { color: inherit; text-decoration: none; }
		.page { width: min(1180px, calc(100% - 32px)); margin: 0 auto; padding: 20px 0 56px; }
		.navbar {
			position: sticky; top: 16px; z-index: 20; display: flex; align-items: center; justify-content: space-between; gap: 16px;
			padding: 16px 20px; background: rgba(11, 17, 32, 0.72); border: 1px solid var(--border); border-radius: 18px; backdrop-filter: blur(18px); box-shadow: var(--shadow);
		}
		.brand { display: inline-flex; align-items: center; gap: 12px; font-weight: 700; }
		.brand-mark { width: 42px; height: 42px; display: grid; place-items: center; border-radius: 14px; color: #07111f; font-weight: 900; background: linear-gradient(135deg, var(--accent), #86efac); }
		.nav-links { display: flex; align-items: center; gap: 8px; }
		.nav-links a { color: var(--muted); font-weight: 600; padding: 10px 14px; border-radius: 999px; transition: 0.2s ease; }
		.nav-links a:hover, .nav-links a:focus-visible, .nav-links a.active { color: var(--text); background: rgba(96, 165, 250, 0.14); outline: none; }
		.menu-button { display: none; align-items: center; justify-content: center; width: 44px; height: 44px; border: 1px solid var(--border); border-radius: 14px; background: rgba(255, 255, 255, 0.04); color: var(--text); cursor: pointer; }
		.hero {
			margin-top: 28px; padding: 72px 28px; border: 1px solid var(--border); border-radius: 32px; box-shadow: var(--shadow);
			background: linear-gradient(180deg, rgba(16, 25, 47, 0.88), rgba(7, 11, 20, 0.86));
		}
		.eyebrow { display: inline-flex; align-items: center; gap: 10px; padding: 8px 14px; border-radius: 999px; color: #dbeafe; background: rgba(59, 130, 246, 0.08); border: 1px solid rgba(96, 165, 250, 0.22); }
		.eyebrow-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 6px rgba(34, 197, 94, 0.15); }
		h1 { margin: 20px 0 14px; font-size: clamp(2.6rem, 6vw, 5rem); line-height: 0.98; letter-spacing: -0.05em; max-width: 11ch; }
		.lead { max-width: 62ch; color: var(--muted); line-height: 1.8; font-size: 1.03rem; }
		.contact-grid { margin-top: 28px; display: grid; grid-template-columns: 0.95fr 1.05fr; gap: 16px; }
		.card { padding: 24px; border-radius: 24px; background: rgba(255, 255, 255, 0.04); border: 1px solid rgba(148, 163, 184, 0.12); }
		.card h2 { margin: 0 0 12px; }
		.info-list { display: grid; gap: 12px; margin-top: 18px; }
		.info-item { padding: 16px; border-radius: 18px; background: rgba(255,255,255,0.03); border: 1px solid rgba(148,163,184,0.1); }
		.info-item strong { display: block; margin-bottom: 6px; }
		.form { display: grid; gap: 14px; }
		label { display: grid; gap: 8px; color: var(--muted); font-size: 0.95rem; }
		input, textarea {
			width: 100%; border: 1px solid rgba(148,163,184,0.18); border-radius: 16px; padding: 14px 16px; background: rgba(7, 11, 20, 0.55); color: var(--text); font: inherit; outline: none;
		}
		textarea { min-height: 150px; resize: vertical; }
		input:focus, textarea:focus { border-color: rgba(96, 165, 250, 0.5); box-shadow: 0 0 0 4px rgba(96, 165, 250, 0.12); }
		.btn {
			display: inline-flex; align-items: center; justify-content: center; min-height: 48px; padding: 0 18px; border-radius: 999px;
			border: 0; cursor: pointer; font-weight: 700; color: #06111d; background: linear-gradient(135deg, var(--accent), #86efac);
		}
		.status { min-height: 24px; color: #bbf7d0; }
		@media (max-width: 860px) {
			.navbar { flex-wrap: wrap; }
			.menu-button { display: inline-flex; }
			.nav-links { width: 100%; display: none; flex-direction: column; align-items: stretch; padding-top: 8px; }
			.nav-links.open { display: flex; }
			.hero { padding: 56px 20px 24px; }
			.contact-grid { grid-template-columns: 1fr; }
		}
	</style>
</head>
<body>
	<div class="page">
		<header class="navbar">
			<a class="brand" href="home.html" aria-label="EdStar home"><span class="brand-mark">E</span><span>EdStar</span></a>
			<button class="menu-button" type="button" aria-label="Toggle navigation" aria-expanded="false" aria-controls="site-nav">☰</button>
			<nav class="nav-links" id="site-nav">
				<a href="home">Home</a>
				<a href="courses">Courses</a>
				<a href="about">About</a>
				<a class="active" href="contact">Contact</a>
			</nav>
		</header>

		<main class="hero">
			<div class="eyebrow"><span class="eyebrow-dot"></span> Contact EdStar</div>
			<h1>Let’s talk about your next step.</h1>
			<p class="lead">Reach out for course guidance, support, or partnership questions. We respond with clear next steps.</p>

			<div class="contact-grid">
				<section class="card">
					<h2>Get in touch</h2>
					<div class="info-list">
						<div class="info-item"><strong>Email</strong>support@edstar.com</div>
						<div class="info-item"><strong>Phone</strong>+91 90000 00000</div>
						<div class="info-item"><strong>Hours</strong>Mon - Sat, 9:00 AM - 6:00 PM</div>
					</div>
				</section>

				<section class="card">
					<h2>Send a message</h2>
					<form class="form" id="contact-form">
						<label>Name <input type="text" name="name" placeholder="Your name" required></label>
						<label>Email <input type="email" name="email" placeholder="Your email" required></label>
						<label>Message <textarea name="message" placeholder="How can we help?" required></textarea></label>
						<button class="btn" type="submit">Send Message</button>
						<div class="status" id="form-status" aria-live="polite"></div>
					</form>
				</section>
			</div>
		</main>
	</div>

	<script>
		const menuButton = document.querySelector('.menu-button');
		const navigation = document.querySelector('.nav-links');
		const form = document.getElementById('contact-form');
		const status = document.getElementById('form-status');

		if (menuButton && navigation) {
			menuButton.addEventListener('click', () => {
				const isOpen = navigation.classList.toggle('open');
				menuButton.setAttribute('aria-expanded', String(isOpen));
			});
		}

		if (form && status) {
			form.addEventListener('submit', (event) => {
				event.preventDefault();
				status.textContent = 'Thanks. Your message has been prepared for submission.';
				form.reset();
			});
		}
	</script>
</body>
</html>
